name: Update libssh2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-libssh2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termind
          submodules: recursive
      - name: Find latest official stable release
        id: release
        run: |
          set -euo pipefail
          upstream=https://github.com/libssh2/libssh2.git
          latest=$(git ls-remote --tags --refs "$upstream" 'libssh2-*' \
            | awk '{print $2}' | sed 's#refs/tags/##' \
            | grep -E '^libssh2-[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          test -n "$latest"
          source_repo=$(mktemp -d)
          trap 'rm -rf "$source_repo"' EXIT
          git -C "$source_repo" init --bare --quiet
          git -C "$source_repo" fetch --quiet --depth=1 "$upstream" "refs/tags/$latest"
          target=$(git -C "$source_repo" rev-parse 'FETCH_HEAD^{commit}')
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          if [ "$(git -C Vendor/libssh2 rev-parse HEAD)" = "$target" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git -C Vendor/libssh2 fetch --depth=1 origin "$target"
            git -C Vendor/libssh2 checkout --detach "$target"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test patched source
        if: steps.release.outputs.changed == 'true'
        run: |
          python3 Script/test-source.py
          python3 Script/prepare-source.py
          cmake -S .build/patched-native -B .build/native -DCRYPTO_BACKEND=OpenSSL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DRUN_DOCKER_TESTS=OFF -DRUN_SSHD_TESTS=OFF
          cmake --build .build/native --parallel 2
          ctest --test-dir .build/native --output-on-failure
          git add Vendor/libssh2
      - uses: peter-evans/create-pull-request@v6
        id: pull-request
        if: steps.release.outputs.changed == 'true'
        with:
          base: termind
          branch: update-libssh2
          add-paths: |
            Vendor/libssh2
          title: 'build: update libssh2 to ${{ steps.release.outputs.tag }}'
          commit-message: 'build: update libssh2 to ${{ steps.release.outputs.tag }}'
          body: 'Update the official submodule pin. Native external-signature regressions passed. Require the dispatched XCFramework and Apple consumer checks before merging, then run Release XCFramework to publish a new package version.'
      - name: Dispatch Apple platform and source checks
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --ref update-libssh2
