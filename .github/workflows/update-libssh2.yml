name: Update libssh2 fork

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-libssh2-fork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: termind
      - name: Find latest Termind fork tag
        id: release
        working-directory: Vendor/libssh2
        run: |
          set -euo pipefail
          latest=$(git ls-remote --tags --refs origin 'libssh2-*-termind-*' \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | grep -E '^libssh2-[0-9]+\.[0-9]+\.[0-9]+-termind-[0-9]+$' \
            | sort -V | tail -n 1)
          test -n "$latest"
          git fetch origin "refs/tags/$latest:refs/tags/$latest"
          current=$(git rev-parse HEAD)
          target=$(git rev-parse "refs/tags/$latest^{commit}")
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$target" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git checkout --detach "$target"
            grep -q libssh2_userauth_publickey_signed include/libssh2.h
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test external signature API
        if: steps.release.outputs.changed == 'true'
        run: |
          cmake -S Vendor/libssh2 -B /tmp/libssh2-build -DCRYPTO_BACKEND=OpenSSL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DRUN_DOCKER_TESTS=OFF -DRUN_SSHD_TESTS=OFF
          cmake --build /tmp/libssh2-build -j 2
          ctest --test-dir /tmp/libssh2-build --output-on-failure
      - uses: peter-evans/create-pull-request@v6
        if: steps.release.outputs.changed == 'true'
        with:
          base: termind
          branch: update-libssh2-fork
          add-paths: Vendor/libssh2
          title: 'Update libssh2 to ${{ steps.release.outputs.tag }}'
          commit-message: 'Update libssh2 to ${{ steps.release.outputs.tag }}'
          body: 'Update the nested libssh2 fork to ${{ steps.release.outputs.tag }}, preserving and testing the complete external-signature API.'
